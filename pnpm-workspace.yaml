packages:
  - '.'
# pnpm 11 reads overrides/allowBuilds here, not package.json pnpm.*
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: false
overrides:
  vite: '7.3.6'
  rollup: '4.63.1'
  flatted: '3.4.4'
  sharp: '0.35.4'
  postcss: '8.5.26'
  ws: '8.21.3'
  js-yaml: '4.3.2'
  nanoid: '3.3.18'
  'minimatch@<9': '3.1.5'
  'minimatch@>=9': '9.0.9'
  'minimatch@9.0.5': '9.0.9'
  'brace-expansion@<2': '1.1.18'
  'brace-expansion@>=2': '2.1.4'
  'picomatch@<4': '2.3.2'
  'picomatch@>=4': '4.0.7'
  'picomatch@4.0.3': '4.0.7'
