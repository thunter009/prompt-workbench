<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="caret" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Background: rounded square -->
  <rect width="512" height="512" rx="108" fill="#0f0f1a"/>
  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.3"/>
  <!-- Prompt chevron > -->
  <path d="M120 160 L240 256 L120 352" fill="none" stroke="url(#g)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Blinking cursor bar -->
  <rect x="280" y="216" width="36" height="80" rx="6" fill="url(#caret)"/>
  <!-- Workbench underline -->
  <rect x="120" y="392" width="272" height="6" rx="3" fill="url(#g)" opacity="0.5"/>
</svg>
